<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Portal - GamerGen</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #141414; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }

        /* Onglets */
        .tabs { 
            display: flex; background: #000; position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--orange);
        }
        .tab-btn { 
            flex: 1; padding: 16px 5px; border: none; background: none; 
            color: #777; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
        }
        .tab-btn.active { color: var(--orange); }

        /* Contenu */
        .feed { padding: 12px; }
        .news-item { 
            background: var(--card); border-radius: 12px; padding: 14px; 
            margin-bottom: 12px; border: 1px solid #222;
        }
        .news-meta { font-size: 0.65rem; color: var(--orange); margin-bottom: 5px; font-weight: bold; }
        .news-title { font-size: 0.92rem; font-weight: 700; line-height: 1.4; }
        
        .news-desc { display: none; font-size: 0.82rem; color: #ccc; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .news-item.open .news-desc { display: block; }
        
        .read-more { 
            display: inline-block; margin-top: 10px; padding: 7px 12px; 
            background: var(--orange); color: #fff; border-radius: 6px; 
            text-decoration: none; font-size: 0.7rem; font-weight: bold;
        }

        .loader { text-align: center; padding: 50px; color: var(--orange); font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab(event, 'vr')">VR</button>
        <button class="tab-btn" onclick="changeTab(event, 'ar')">Lunettes</button>
        <button class="tab-btn" onclick="changeTab(event, 'gaming')">GamerGen</button>
    </div>

    <div id="feed-container" class="feed">
        <div class="loader">CHARGEMENT...</div>
    </div>

    <script>
        const SOURCES = {
            vr: 'https://www.realite-virtuelle.com/feed/',
            ar: 'https://www.augmented-reality.fr/feed/',
            gaming: 'https://gamergen.com/rss/news'
        };

        async function fetchNews(cat) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loader">MISE À JOUR...</div>';

            try {
                // Utilisation du proxy rss2json pour transformer le flux GamerGen en JSON
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(SOURCES[cat])}`);
                const data = await res.json();

                if (data.status !== 'ok') throw new Error();

                container.innerHTML = '';
                data.items.slice(0, 10).forEach(item => {
                    const article = document.createElement('div');
                    article.className = 'news-item';
                    article.onclick = () => article.classList.toggle('open');
                    
                    // Extraction et nettoyage du texte de description
                    let description = item.description || item.content || "";
                    let cleanText = description.replace(/<[^>]*>?/gm, '').substring(0, 160);

                    article.innerHTML = `
                        <div class="news-meta">GAMERGEN • ${new Date(item.pubDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}</div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">
                            ${cleanText}...
                            <br>
                            <a href="${item.link}" target="_blank" class="read-more" onclick="event.stopPropagation();">LIRE L'ARTICLE</a>
                        </div>
                    `;
                    container.appendChild(article);
                });
            } catch (e) {
                container.innerHTML = '<div class="loader">ERREUR DE CHARGEMENT<br><small>Réessayez dans quelques secondes</small></div>';
            }
        }

        function changeTab(e, cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            fetchNews(cat);
            window.scrollTo(0,0);
        }

        // Lancement par défaut sur VR
        window.onload = () => fetchNews('vr');
    </script>
</body>
</html>
