<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Hub Tech</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #121212; --text: #fff; --gray: #777; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* Navigation Onglets - Optimisée pour 3 colonnes */
        .tabs { 
            display: flex; background: #000; position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--orange);
        }
        .tab-btn { 
            flex: 1; padding: 15px 2px; border: none; background: none; 
            color: var(--gray); font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: -0.2px;
        }
        .tab-btn.active { color: var(--orange); border-bottom: 2px solid var(--orange); margin-bottom: -2px; }

        /* Flux de News */
        .feed { padding: 10px; max-width: 480px; margin: auto; }
        .news-item { 
            background: var(--card); border-radius: 12px; padding: 12px; 
            margin-bottom: 10px; border: 1px solid #222;
        }
        .news-item:active { background: #1a1a1a; }
        
        .news-meta { font-size: 0.6rem; color: var(--orange); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; display: flex; justify-content: space-between; }
        .news-title { font-size: 0.9rem; font-weight: 700; line-height: 1.3; color: #fff; }
        
        .news-desc { display: none; font-size: 0.8rem; color: #bbb; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; line-height: 1.4; }
        .news-item.open .news-desc { display: block; }
        
        .read-more { 
            display: inline-block; margin-top: 10px; padding: 8px 12px; 
            background: var(--orange); color: #fff; border-radius: 6px; 
            text-decoration: none; font-size: 0.7rem; font-weight: bold;
        }

        .loader { text-align: center; padding: 60px 20px; color: var(--orange); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab(event, 'wear')">VR & AR</button>
        <button class="tab-btn" onclick="changeTab(event, 'phone')">Smartphones</button>
        <button class="tab-btn" onclick="changeTab(event, 'game')">Gaming</button>
    </div>

    <div id="feed-container" class="feed">
        <div class="loader">Initialisation...</div>
    </div>

    <script>
        const SOURCES = {
            wear: [
                'https://www.realite-virtuelle.com/feed/',
                'https://uploadvr.com/rss/'
            ],
            phone: [
                'https://www.frandroid.com/feed'
            ],
            game: [
                'https://gamergen.com/rss/news'
            ]
        };

        async function fetchNews(cat) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loader">Chargement flux...</div>';

            let allArticles = [];

            try {
                for (let url of SOURCES[cat]) {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const data = await res.json();
                    
                    if (data.status === 'ok') {
                        const articles = data.items.map(item => ({
                            ...item,
                            sourceDisplay: data.feed.title.length > 15 ? data.feed.title.substring(0,12)+'...' : data.feed.title
                        }));
                        allArticles = [...allArticles, ...articles];
                    }
                }

                // Tri chronologique
                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                container.innerHTML = '';
                
                // On limite à 12 pour ne pas surcharger le Rabbit R1
                allArticles.slice(0, 12).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'news-item';
                    card.onclick = () => card.classList.toggle('open');
                    
                    const temp = document.createElement('div');
                    temp.innerHTML = item.description || item.content || "";
                    const cleanText = temp.textContent || temp.innerText || "Cliquez pour lire le résumé.";

                    card.innerHTML = `
                        <div class="news-meta">
                            <span>${item.sourceDisplay}</span>
                            <span>${new Date(item.pubDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">
                            ${cleanText.substring(0, 170).trim()}...
                            <br>
                            <a href="${item.link}" target="_blank" class="read-more" onclick="event.stopPropagation();">LIRE L'ARTICLE</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (e) {
                container.innerHTML = '<div class="loader">ERREUR RÉSEAU.<br><small>Vérifie ta connexion R1</small></div>';
            }
        }

        function changeTab(e, cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            fetchNews(cat);
            window.scrollTo(0,0);
        }

        // Lancer sur l'onglet Wearables par défaut
        window.onload = () => fetchNews('wear');
    </script>
</body>
</html>
