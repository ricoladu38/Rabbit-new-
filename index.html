<script>
    const SOURCES = {
        wear: ['https://www.realite-virtuelle.com/feed/', 'https://uploadvr.com/rss/'],
        phone: ['https://www.frandroid.com/feed'],
        game: ['https://gamergen.com/rss/news']
    };

    let currentCat = 'wear';
    const scrollZone = document.getElementById('main-scroll');
    const indicator = document.getElementById('scroll-indicator');

    // --- 1. INITIALISATION DES LISTENERS HARDWARE RABBIT ---
    function initializeHardwareListeners() {
        // Molette vers le HAUT
        window.addEventListener('scrollUp', () => {
            scrollZone.scrollBy(0, -150); // Défilement vers le haut
            showIndicator();
            vibrate(10); // Retour haptique molette
        });
        
        // Molette vers le BAS
        window.addEventListener('scrollDown', () => {
            scrollZone.scrollBy(0, 150); // Défilement vers le bas
            showIndicator();
            vibrate(10); // Retour haptique molette
        });
        
        // Bouton latéral (PTT) -> Ici utilisé pour Actualiser (Refresh)
        window.addEventListener('sideClick', () => {
            triggerRefresh();
        });
        
        // Appui long -> Changement d'onglet rapide par exemple
        window.addEventListener('longPressStart', () => {
            vibrate(100);
            console.log('Mode sélection activé');
        });
    }

    // --- 2. GESTION VISUELLE ET VIBRATION ---
    function showIndicator() {
        indicator.style.opacity = "1";
        const scrollPct = scrollZone.scrollTop / (scrollZone.scrollHeight - scrollZone.clientHeight);
        const moveY = scrollPct * (window.innerHeight - 100);
        indicator.style.transform = `translateY(${moveY}px)`;
        
        clearTimeout(window.scrollTimer);
        window.scrollTimer = setTimeout(() => indicator.style.opacity = "0", 800);
    }

    function vibrate(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    function triggerRefresh() {
        vibrate([50, 50, 50]); // Triple vibration Rabbit style
        document.body.style.animation = "shake-ui 0.3s";
        setTimeout(() => document.body.style.animation = "", 300);
        fetchNews(currentCat);
    }

    // --- 3. ACCÉLÉROMÈTRE (SECQUER) ---
    let lastShake = 0;
    window.addEventListener('devicemotion', (e) => {
        const acc = e.accelerationIncludingGravity;
        if (acc && (Math.abs(acc.x) + Math.abs(acc.y) > 22)) {
            if (Date.now() - lastShake > 2000) {
                lastShake = Date.now();
                triggerRefresh();
            }
        }
    });

    // --- 4. RÉCUPÉRATION DES NEWS ---
    async function fetchNews(cat) {
        const container = document.getElementById('feed-container');
        container.innerHTML = '<div class="loader">SYNCHRONISATION...</div>';
        try {
            let all = [];
            for (let url of SOURCES[cat]) {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                const d = await res.json();
                if (d.status === 'ok') {
                    all = [...all, ...d.items.map(i => ({
                        ...i, 
                        src: d.feed.title.substring(0,10)
                    }))];
                }
            }
            all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
            container.innerHTML = '';
            all.slice(0, 15).forEach(item => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.onclick = () => { div.classList.toggle('open'); vibrate(20); };
                const desc = (item.description || "").replace(/<[^>]*>?/gm, '').substring(0, 150);
                div.innerHTML = `
                    <div class="news-meta"><span>${item.src}</span><span>${new Date(item.pubDate).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span></div>
                    <div class="news-title">${item.title}</div>
                    <div class="news-desc">${desc}...<br><br><a href="${item.link}" target="_blank" style="color:var(--orange); font-weight:bold; text-decoration:none;">LIRE LA SUITE</a></div>
                `;
                container.appendChild(div);
            });
        } catch (e) { container.innerHTML = '<div class="loader">ERREUR RÉSEAU</div>'; }
    }

    function changeTab(cat) {
        vibrate(30);
        currentCat = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + (cat === 'wear' ? 'wear' : cat === 'phone' ? 'phone' : 'game')).classList.add('active'));
        fetchNews(cat);
        scrollZone.scrollTop = 0;
    }

    // --- 5. LANCEMENT ---
    window.onload = () => {
        initializeHardwareListeners();
        fetchNews('wear');
    };
</script>
