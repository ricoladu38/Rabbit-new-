<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #151515; --text: #fff; --read: #0a0a0a; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }

        /* Navigation */
        .header { background: #000; border-bottom: 2px solid var(--orange); position: sticky; top: 0; z-index: 100; }
        .tabs { display: flex; height: 45px; }
        .tab-btn { flex: 1; border: none; background: none; color: #666; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { color: var(--orange); }

        /* Content Area */
        #main-scroll { height: calc(100vh - 45px); overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .feed-container { padding: 12px; padding-bottom: 100px; }

        /* News Cards */
        .news-item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; transition: opacity 0.3s; }
        .news-item.read { opacity: 0.4; background: var(--read); }
        .news-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .news-meta { font-size: 0.6rem; color: var(--orange); display: flex; justify-content: space-between; margin-bottom: 8px; }
        .news-desc { display: none; font-size: 0.85rem; color: #ccc; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .news-item.open .news-desc { display: block; }

        /* Buttons */
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.75rem; }
        .btn-speak { background: #333; }
        .btn-read { background: var(--orange); }

        /* Overlay Options */
        #options-menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 20px; border: 2px solid var(--orange); z-index: 300; display: none; width: 80%; text-align: center; }
        .lang-btn { padding: 10px 20px; margin: 5px; border-radius: 8px; border: none; background: #333; color: white; font-weight: bold; }
        .lang-btn.active { background: var(--orange); }

        /* Fixed FAB */
        .fab { position: fixed; width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-size: 20px; }
        #refresh-btn { bottom: 20px; right: 20px; background: var(--orange); color: white; }
        #opt-trigger { bottom: 20px; left: 20px; background: #333; color: white; }

        .loader { text-align: center; padding: 50px; color: var(--orange); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="tabs">
            <button id="tab-wear" class="tab-btn active" onclick="changeCategory('wear')">VR/AR</button>
            <button id="tab-phone" class="tab-btn" onclick="changeCategory('phone')">Phones</button>
            <button id="tab-game" class="tab-btn" onclick="changeCategory('game')">Gaming</button>
        </div>
    </div>

    <button class="fab" id="opt-trigger" onclick="toggleMenu()">⚙️</button>
    <button class="fab" id="refresh-btn" onclick="triggerRefresh()">🔄</button>

    <div id="options-menu">
        <p style="color:var(--orange); font-weight:bold;">SOURCES & LANGUE</p>
        <button id="btn-fr" class="lang-btn" onclick="setLang('fr')">Français</button>
        <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <button class="action-btn btn-read" style="width:100%;" onclick="toggleMenu()">OK</button>
    </div>

    <div id="main-scroll">
        <div id="feed-container" class="feed-container"></div>
    </div>

    <script>
        const pageModules = {};
        let currentCat = 'wear';
        let currentLang = localStorage.getItem('newsLang') || 'fr';
        let readArticles = JSON.parse(localStorage.getItem('readArticles') || '[]');

        const SOURCES = {
            fr: { 
                wear: ['https://www.realite-virtuelle.com/feed/'], 
                phone: ['https://www.frandroid.com/feed'], 
                game: ['https://gamergen.com/rss/news'] 
            },
            en: { 
                wear: ['https://uploadvr.com/rss/'], 
                phone: ['https://www.theverge.com/rss/index.xml'], 
                game: ['https://feeds.feedburner.com/ign/news'] 
            }
        };

        // --- FONCTION SPEAK VIA PLUGIN MESSAGE HANDLER (TON SYSTÈME) ---
        function speakNews(title, description) {
            const text = `News: ${title}. Résumé: ${description}`;
            if (typeof PluginMessageHandler !== 'undefined') {
                const payload = {
                    message: text,
                    useLLM: true,
                    wantsR1Response: true,
                    wantsJournalEntry: false 
                };
                PluginMessageHandler.postMessage(JSON.stringify(payload));
            } else {
                // Fallback navigateur
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = currentLang === 'fr' ? 'fr-FR' : 'en-US';
                window.speechSynthesis.speak(msg);
            }
            if(navigator.vibrate) navigator.vibrate(40);
        }

        // --- HARDWARE MODULE (RABBIT R1) ---
        const hardwareModule = {
            handleScrollUp: () => document.getElementById('main-scroll').scrollBy(0, -220),
            handleScrollDown: () => document.getElementById('main-scroll').scrollBy(0, 220),
            handlePTT: () => triggerRefresh()
        };
        pageModules.hardware = hardwareModule;

        function initHardware() {
            window.addEventListener('scrollUp', hardwareModule.handleScrollUp);
            window.addEventListener('scrollDown', hardwareModule.handleScrollDown);
            window.addEventListener('sideClick', hardwareModule.handlePTT);
        }

        // --- LOGIQUE CORE ---
        async function fetchNews(cat) {
            currentCat = cat;
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loader">CHARGEMENT...</div>';
            
            try {
                let all = [];
                const urls = SOURCES[currentLang][cat];
                for (let url of urls) {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const d = await res.json();
                    if (d.status === 'ok') all = [...all, ...d.items.map(i => ({...i, src: d.feed.title.substring(0,12)}))];
                }
                all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                
                container.innerHTML = '';
                all.slice(0, 15).forEach(item => {
                    const id = item.guid || item.link;
                    const isRead = readArticles.includes(id);
                    const div = document.createElement('div');
                    div.className = `news-item ${isRead ? 'read' : ''}`;
                    
                    const desc = (item.description || "").replace(/<[^>]*>?/gm, '').substring(0, 200);
                    const cleanT = item.title.replace(/'/g, " ");
                    const cleanD = desc.replace(/'/g, " ");

                    div.innerHTML = `
                        <div class="news-meta"><span>${item.src}</span><span>${new Date(item.pubDate).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">
                            ${desc}...
                            <div class="card-actions">
                                <button class="action-btn btn-speak" onclick="event.stopPropagation(); speakNews('${cleanT}', '${cleanD}')">🔊 ÉCOUTER</button>
                                <button class="action-btn btn-read" onclick="event.stopPropagation(); window.location.href='${item.link}'">LIRE</button>
                            </div>
                        </div>
                    `;
                    div.onclick = () => { 
                        div.classList.toggle('open'); 
                        if(!isRead) {
                            readArticles.push(id);
                            localStorage.setItem('readArticles', JSON.stringify(readArticles.slice(-50)));
                        }
                    };
                    container.appendChild(div);
                });
            } catch (e) { container.innerHTML = '<div class="loader">ERREUR RÉSEAU</div>'; }
        }

        function toggleMenu() {
            const m = document.getElementById('options-menu');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
            updateLangUI();
        }

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('newsLang', l);
            updateLangUI();
            fetchNews(currentCat);
            setTimeout(toggleMenu, 300);
        }

        function updateLangUI() {
            document.getElementById('btn-fr').className = `lang-btn ${currentLang === 'fr' ? 'active' : ''}`;
            document.getElementById('btn-en').className = `lang-btn ${currentLang === 'en' ? 'active' : ''}`;
        }

        function triggerRefresh() { if(navigator.vibrate) navigator.vibrate([30,30]); fetchNews(currentCat); }

        function changeCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + cat).classList.add('active');
            fetchNews(cat);
            document.getElementById('main-scroll').scrollTop = 0;
        }

        window.onload = () => {
            initHardware();
            fetchNews('wear');
        };
    </script>
</body>
</html>
