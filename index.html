<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Pro Hub</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #151515; --text: #fff; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
        }

        /* Barre de défilement personnalisée Rabbit */
        #scroll-indicator {
            position: fixed; right: 2px; top: 50px; width: 4px; height: 30px;
            background: var(--orange); border-radius: 2px; opacity: 0;
            transition: opacity 0.3s, transform 0.1s; z-index: 1000;
        }

        .tabs { 
            display: flex; background: #000; position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--orange); height: 50px;
        }
        .tab-btn { flex: 1; border: none; background: none; color: #666; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { color: var(--orange); border-bottom: 2px solid var(--orange); }

        /* Zone de contenu scrollable */
        #main-scroll {
            height: calc(100vh - 50px); overflow-y: auto; padding: 12px;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        
        .news-item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .news-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; }
        .news-meta { font-size: 0.6rem; color: var(--orange); margin-bottom: 8px; display: flex; justify-content: space-between; text-transform: uppercase; }
        .news-desc { display: none; font-size: 0.85rem; color: #ccc; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .news-item.open .news-desc { display: block; }

        #refresh-btn {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: var(--orange); border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        #refresh-btn svg { width: 24px; height: 24px; fill: white; }

        .loader { text-align: center; padding: 50px; color: var(--orange); font-size: 0.8rem; }
        
        @keyframes shake-ui { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    </style>
</head>
<body>

    <div id="scroll-indicator"></div>

    <div class="tabs">
        <button id="tab-wear" class="tab-btn active" onclick="changeTab('wear')">VR & AR</button>
        <button id="tab-phone" class="tab-btn" onclick="changeTab('phone')">Phones</button>
        <button id="tab-game" class="tab-btn" onclick="changeTab('game')">Gaming</button>
    </div>

    <div id="main-scroll">
        <div id="feed-container">
            <div class="loader">CHARGEMENT...</div>
        </div>
    </div>

    <button id="refresh-btn" onclick="triggerRefresh()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>

    <script>
        const SOURCES = {
            wear: ['https://www.realite-virtuelle.com/feed/', 'https://uploadvr.com/rss/'],
            phone: ['https://www.frandroid.com/feed'],
            game: ['https://gamergen.com/rss/news']
        };

        let currentCat = 'wear';
        const scrollZone = document.getElementById('main-scroll');
        const indicator = document.getElementById('scroll-indicator');

        // --- HARDWARE RABBIT R1 ---

        // Gestion Molette (Keycodes)
        window.addEventListener('keydown', (e) => {
            const step = 120;
            if (e.keyCode === 40 || e.keyCode === 34) { // BAS
                scrollZone.scrollBy(0, step);
                showIndicator();
                vibrate(10);
            } else if (e.keyCode === 38 || e.keyCode === 33) { // HAUT
                scrollZone.scrollBy(0, -step);
                showIndicator();
                vibrate(10);
            }
        });

        // Mise à jour de la barre orange
        scrollZone.addEventListener('scroll', () => {
            const scrollPct = scrollZone.scrollTop / (scrollZone.scrollHeight - scrollZone.clientHeight);
            const moveY = scrollPct * (window.innerHeight - 100);
            indicator.style.transform = `translateY(${moveY}px)`;
        });

        function showIndicator() {
            indicator.style.opacity = "1";
            clearTimeout(window.scrollTimer);
            window.scrollTimer = setTimeout(() => indicator.style.opacity = "0", 1000);
        }

        // Accéléromètre
        let lastShake = 0;
        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (acc && (Math.abs(acc.x) + Math.abs(acc.y) > 20)) {
                if (Date.now() - lastShake > 2000) {
                    lastShake = Date.now();
                    triggerRefresh();
                }
            }
        });

        function vibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function triggerRefresh() {
            vibrate([50, 50, 50]);
            document.body.style.animation = "shake-ui 0.3s";
            setTimeout(() => document.body.style.animation = "", 300);
            fetchNews(currentCat);
        }

        // --- LOGIQUE NEWS ---

        async function fetchNews(cat) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loader">MAJ...</div>';
            try {
                let all = [];
                for (let url of SOURCES[cat]) {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const d = await res.json();
                    if (d.status === 'ok') all = [...all, ...d.items.map(i => ({...i, src: d.feed.title.substring(0,8)}))];
                }
                all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                container.innerHTML = '';
                all.slice(0, 15).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.onclick = () => { div.classList.toggle('open'); vibrate(20); };
                    const desc = (item.description || "").replace(/<[^>]*>?/gm, '').substring(0, 150);
                    div.innerHTML = `
                        <div class="news-meta"><span>${item.src}</span><span>${new Date(item.pubDate).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span></div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">${desc}...<br><br><a href="${item.link}" target="_blank" style="color:var(--orange); font-weight:bold; text-decoration:none;">LIRE SOURCE</a></div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { container.innerHTML = '<div class="loader">ERREUR</div>'; }
        }

        function changeTab(cat) {
            vibrate(30);
            currentCat = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + (cat === 'wear' ? 'wear' : cat === 'phone' ? 'phone' : 'game')).classList.add('active');
            fetchNews(cat);
            scrollZone.scrollTop = 0;
        }

        // Focus forcer pour capter la molette immédiatement
        window.onload = () => {
            fetchNews('wear');
            window.focus();
        };
    </script>
</body>
</html>
