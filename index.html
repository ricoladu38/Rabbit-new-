<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit News Hub</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #111; --text: #fff; --gray: #888; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }

        /* Navigation Onglets */
        .tabs { 
            display: flex; background: #000; position: sticky; top: 0; z-index: 10;
            border-bottom: 1px solid #222;
        }
        .tab-btn { 
            flex: 1; padding: 15px 5px; border: none; background: none; 
            color: var(--gray); font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
        }
        .tab-btn.active { color: var(--orange); border-bottom: 2px solid var(--orange); }

        /* Liste des News */
        .news-list { padding: 10px; max-width: 400px; margin: auto; }
        .news-item { 
            background: var(--card); border-radius: 12px; padding: 12px; 
            margin-bottom: 10px; border: 1px solid #222;
            transition: 0.2s;
        }
        .news-item:active { background: #1a1a1a; border-color: var(--orange); }
        
        .news-title { font-size: 0.95rem; font-weight: bold; line-height: 1.3; margin-bottom: 6px; }
        .news-desc { font-size: 0.8rem; color: #bbb; display: none; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
        .news-item.open .news-desc { display: block; }
        
        .news-meta { font-size: 0.7rem; color: var(--orange); display: flex; justify-content: space-between; }
        .source-link { 
            display: inline-block; margin-top: 10px; padding: 5px 10px; 
            background: var(--orange); color: #fff; border-radius: 5px; 
            text-decoration: none; font-size: 0.75rem; 
        }

        .loader { text-align: center; padding: 30px; color: var(--orange); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'vr')">VR</button>
        <button class="tab-btn" onclick="switchTab(event, 'ar')">Lunettes</button>
        <button class="tab-btn" onclick="switchTab(event, 'gaming')">Gaming</button>
    </div>

    <div id="content" class="news-list">
        <div class="loader">Chargement...</div>
    </div>

    <script>
        const FEEDS = {
            vr: 'https://www.realite-virtuelle.com/feed/',
            ar: 'https://www.numerama.com/tech/feed/',
            gaming: 'https://www.jeuxvideo.com/rss/news.xml'
        };

        let currentTab = 'vr';

        // Fonction pour changer d'onglet
        function switchTab(evt, cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            currentTab = cat;
            loadNews(cat);
        }

        // Récupérer et afficher les news
        async function loadNews(cat) {
            const container = document.getElementById('content');
            container.innerHTML = '<div class="loader">Lecture du flux...</div>';

            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(FEEDS[cat])}`);
                const data = await response.json();
                
                container.innerHTML = ""; 

                data.items.slice(0, 8).forEach(item => {
                    // Nettoyage de la description (on enlève les balises HTML)
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = item.description;
                    const cleanDesc = tempDiv.textContent || tempDiv.innerText || "";

                    const article = document.createElement('div');
                    article.className = 'news-item';
                    article.onclick = () => article.classList.toggle('open');
                    
                    article.innerHTML = `
                        <div class="news-meta">
                            <span>${cat.toUpperCase()}</span>
                            <span>${new Date(item.pubDate).toLocaleDateString('fr-FR')}</span>
                        </div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">
                            ${cleanDesc.substring(0, 150)}...
                            <br>
                            <a href="${item.link}" target="_blank" class="source-link">Lire l'article complet</a>
                        </div>
                    `;
                    container.appendChild(article);
                });
            } catch (e) {
                container.innerHTML = "<div class='loader'>Erreur réseau. Réessaye.</div>";
            }
        }

        // Lancer au démarrage
        window.onload = () => loadNews('vr');
    </script>
</body>
</html>
