<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Tech 2025</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #111; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        
        .tabs { display: flex; background: #000; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--orange); }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #666; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { color: var(--orange); border-bottom: 2px solid var(--orange); }

        .news-list { padding: 10px; }
        .news-item { 
            background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; 
            border: 1px solid #222; cursor: pointer;
        }
        .news-item:active { background: #1a1a1a; }
        
        .news-title { font-size: 0.9rem; font-weight: bold; line-height: 1.3; }
        .news-meta { font-size: 0.65rem; color: var(--orange); margin-bottom: 5px; text-transform: uppercase; }
        
        .news-content { display: none; font-size: 0.8rem; color: #bbb; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .news-item.open .news-content { display: block; }
        
        .btn-link { display: inline-block; margin-top: 10px; color: var(--orange); text-decoration: none; font-weight: bold; font-size: 0.75rem; }
        .loader { text-align: center; padding: 40px; color: var(--orange); font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'vr')">Réalité Virtuelle</button>
    <button class="tab-btn" onclick="switchTab(event, 'ar')">Lunettes AR</button>
    <button class="tab-btn" onclick="switchTab(event, 'gaming')">Gaming</button>
</div>

<div id="news-feed" class="news-list">
    <div class="loader">Connexion aux serveurs...</div>
</div>

<script>
    const SOURCES = {
        vr: 'https://realitevirtuelle.com/feed/',
        ar: 'https://www.augmented-reality.fr/feed/',
        gaming: 'https://gamergen.com/rss/news'
    };

    async function loadNews(category) {
        const container = document.getElementById('news-feed');
        container.innerHTML = '<div class="loader">Mise à jour des news...</div>';

        try {
            // Utilisation d'un proxy RSS vers JSON pour la rapidité sur R1
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(SOURCES[category])}`);
            const data = await response.json();

            container.innerHTML = ""; 

            data.items.slice(0, 7).forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-item';
                card.onclick = () => card.classList.toggle('open');
                
                // Nettoyage sommaire de la description
                const summary = item.description.replace(/<[^>]*>?/gm, '').substring(0, 120);

                card.innerHTML = `
                    <div class="news-meta">${category} • ${new Date(item.pubDate).toLocaleDateString('fr-FR')}</div>
                    <div class="news-title">${item.title}</div>
                    <div class="news-content">
                        ${summary}...
                        <br>
                        <a href="${item.link}" target="_blank" class="btn-link">Ouvrir la source ›</a>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            container.innerHTML = "<div class='loader'>Sources indisponibles.</div>";
        }
    }

    function switchTab(evt, cat) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        evt.currentTarget.classList.add('active');
        loadNews(cat);
    }

    window.onload = () => loadNews('vr');
</script>
</body>
</html>
