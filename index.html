<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit News Pro</title>
    <style>
        :root { --orange: #ff4e00; --bg: #000; --card: #151515; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }

        /* Navigation */
        .tabs { display: flex; background: #000; border-bottom: 2px solid var(--orange); height: 50px; position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; border: none; background: none; color: #666; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { color: var(--orange); }

        /* Zone de défilement */
        #main-scroll { height: calc(100vh - 50px); overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .feed { padding: 12px; padding-bottom: 100px; }

        /* Cartes News */
        .news-item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .news-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; pointer-events: none; }
        .news-meta { font-size: 0.6rem; color: var(--orange); margin-bottom: 5px; display: flex; justify-content: space-between; pointer-events: none; }
        
        .news-desc { display: none; font-size: 0.85rem; color: #ccc; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .news-item.open .news-desc { display: block; }

        /* Bouton Actualiser */
        #refresh-btn {
            position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px;
            background: var(--orange); border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; z-index: 200;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #refresh-btn svg { width: 28px; height: 28px; fill: white; }

        /* Indicateur de Molette */
        #scroll-indicator { position: fixed; right: 2px; top: 60px; width: 4px; height: 40px; background: var(--orange); opacity: 0; transition: opacity 0.5s; border-radius: 2px; z-index: 150; }
        
        .loader { text-align: center; padding: 50px; color: var(--orange); font-weight: bold; font-size: 0.8rem; }
        
        @keyframes shake-ui { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(6px); } 75% { transform: translateX(-6px); } }
    </style>
</head>
<body>

    <div id="scroll-indicator"></div>

    <div class="tabs">
        <button id="tab-wear" class="tab-btn active" onclick="changeCategory('wear')">VR & AR</button>
        <button id="tab-phone" class="tab-btn" onclick="changeCategory('phone')">Phones</button>
        <button id="tab-game" class="tab-btn" onclick="changeCategory('game')">Gaming</button>
    </div>

    <button id="refresh-btn" onclick="triggerRefresh()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>

    <div id="main-scroll">
        <div id="feed-container"></div>
    </div>

    <script>
        // --- CONFIGURATION SDK RABBIT ---
        const pageModules = {};
        let currentPage = 'hardware'; 
        let currentCat = 'wear';
        const SOURCES = {
            wear: ['https://www.realite-virtuelle.com/feed/', 'https://uploadvr.com/rss/'],
            phone: ['https://www.frandroid.com/feed'],
            game: ['https://gamergen.com/rss/news']
        };

        function doVibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // --- MODULE HARDWARE (MOLETTE & PTT) ---
        const hardwareModule = {
            handleScrollUp: function() {
                const zone = document.getElementById('main-scroll');
                if (zone) { zone.scrollBy(0, -180); this.updateInd(zone); doVibrate(10); }
            },
            handleScrollDown: function() {
                const zone = document.getElementById('main-scroll');
                if (zone) { zone.scrollBy(0, 180); this.updateInd(zone); doVibrate(10); }
            },
            handlePTT: function() {
                triggerRefresh();
            },
            updateInd: function(zone) {
                const ind = document.getElementById('scroll-indicator');
                ind.style.opacity = "1";
                const pct = zone.scrollTop / (zone.scrollHeight - zone.clientHeight);
                ind.style.transform = `translateY(${pct * (window.innerHeight - 120)}px)`;
                clearTimeout(this.t);
                this.t = setTimeout(() => ind.style.opacity = "0", 800);
            }
        };

        pageModules.hardware = hardwareModule;

        // Liaison avec les événements système du R1
        function initializeHardwareListeners() {
            window.addEventListener('scrollUp', () => { hardwareModule.handleScrollUp(); });
            window.addEventListener('scrollDown', () => { hardwareModule.handleScrollDown(); });
            window.addEventListener('sideClick', () => { hardwareModule.handlePTT(); });
        }

        // --- ACCELEROMETRE (SECQUER) ---
        let lastShake = 0;
        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (acc) {
                let force = Math.abs(acc.x) + Math.abs(acc.y);
                if (force > 28 && (Date.now() - lastShake > 2000)) {
                    lastShake = Date.now();
                    triggerRefresh();
                }
            }
        });

        // --- LOGIQUE NEWS ---
        function triggerRefresh() {
            doVibrate([40, 40, 40]);
            document.body.style.animation = "shake-ui 0.3s";
            setTimeout(() => document.body.style.animation = "", 300);
            fetchNews(currentCat);
        }

        async function fetchNews(cat) {
            currentCat = cat;
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="loader">CHARGEMENT...</div>';
            try {
                let all = [];
                for (let url of SOURCES[cat]) {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const d = await res.json();
                    if (d.status === 'ok') {
                        all = [...all, ...d.items.map(i => ({...i, src: d.feed.title.substring(0,12)}))];
                    }
                }
                all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                container.innerHTML = '';
                all.slice(0, 15).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.onclick = (e) => {
                        if(!e.target.hasAttribute('data-link')) {
                            div.classList.toggle('open'); 
                            doVibrate(15); 
                        }
                    };
                    const desc = (item.description || "").replace(/<[^>]*>?/gm, '').substring(0, 160);
                    div.innerHTML = `
                        <div class="news-meta"><span>${item.src}</span><span>${new Date(item.pubDate).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span></div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-desc">
                            ${desc}...<br><br>
                            <div data-link="true" onclick="window.location.href='${item.link}'" 
                                 style="display:inline-block; background:var(--orange); color:white; padding:12px 20px; border-radius:10px; font-weight:bold; font-size:0.8rem; text-align:center;">
                                 LIRE L'ARTICLE
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { container.innerHTML = '<div class="loader">ERREUR RÉSEAU</div>'; }
        }

        function changeCategory(cat) {
            doVibrate(40);
            currentCat = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + cat).classList.add('active');
            fetchNews(cat);
            document.getElementById('main-scroll').scrollTop = 0;
        }

        // Lancement
        window.onload = () => {
            initializeHardwareListeners();
            fetchNews('wear');
        };
    </script>
</body>
</html>
</html>
